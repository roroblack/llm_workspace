<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{BRAND}} · 쇼핑</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>🛍️ <span data-brand></span> 스토어</h1>
    <p class="sub">상품을 담아 주문하세요. 결제 승인 전 미리보기로 재고·금액을 확인합니다.</p>
    <nav class="top-nav">
      <a href="/static/shop.html" class="active">🛍️ 쇼핑</a>
      <a href="/static/index.html">💬 AI 상담</a>
      <a href="/static/video.html">🎥 화상 상담</a>
      <a href="/static/mypage.html">🙍 마이페이지</a>
      <a href="/static/orders.html">🧾 주문내역(개발)</a>
    </nav>
  </header>

  <main class="shop-layout">
    <section class="shop-main">
      <div class="shop-toolbar">
        <p class="auth-status" id="authStatusBar"></p>
        <div class="shop-filters">
          <input id="searchInput" type="search" placeholder="상품 검색" autocomplete="off" />
          <select id="categoryFilter"><option value="">전체 분류</option></select>
        </div>
      </div>
      <div id="productGrid" class="product-grid"></div>
      <p id="gridEmpty" class="hint" hidden>조건에 맞는 상품이 없습니다.</p>
    </section>

    <aside class="cart-panel" id="cartPanel">
      <h2>🛒 장바구니 <span id="cartCount" class="cart-count">0</span></h2>
      <div id="cartItems" class="cart-items"></div>
      <p id="cartEmpty" class="hint">담긴 상품이 없습니다.</p>
      <div class="cart-summary">
        <span>합계</span><strong id="cartTotal">0원</strong>
      </div>
      <button id="checkoutBtn" type="button" disabled>주문하기</button>
      <p class="voice-status" id="cartStatus"></p>
    </aside>
  </main>

  <!-- 주문 미리보기/승인 모달 -->
  <div id="checkoutModal" class="modal-overlay" hidden>
    <div class="modal-box">
      <h3>주문 미리보기</h3>
      <p class="hint">아래 내용으로 결제를 승인합니다. 재고가 부족하면 승인할 수 없습니다.</p>
      <div id="previewBody"></div>
      <div class="modal-actions">
        <button id="confirmOrderBtn" type="button">✅ 결제 승인</button>
        <button id="cancelCheckoutBtn" type="button" class="secondary">취소</button>
      </div>
      <p class="voice-status" id="checkoutStatus"></p>
    </div>
  </div>

  <!-- 로그인 모달(주문 시 미인증이면) -->
  <div id="loginModal" class="modal-overlay" hidden>
    <div class="modal-box">
      <h3>로그인이 필요합니다</h3>
      <p class="hint">주문하려면 로그인하세요. 얼굴을 등록한 계정은 웹캠 2차 인증이 추가됩니다.</p>
      <div class="field">아이디<input id="shopUser" type="text" autocomplete="username" /></div>
      <div class="field">비밀번호<input id="shopPass" type="password" autocomplete="current-password" /></div>
      <div class="modal-actions">
        <button id="shopLoginBtn" type="button">로그인</button>
        <button id="shopSignupBtn" type="button" class="secondary">간편가입</button>
        <button id="cancelLoginBtn" type="button" class="secondary">취소</button>
      </div>
      <p class="voice-status" id="shopLoginStatus"></p>
    </div>
  </div>

  <script src="/static/common.js"></script>
  <script src="/static/shop.js"></script>
</body>
</html>

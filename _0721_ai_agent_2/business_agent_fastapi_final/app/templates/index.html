<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="container">
    <header>
        <h1>Business Agent</h1>
        <p>ReAct → RAG → A2A → LangGraph → MCP 통합 FastAPI 앱</p>
    </header>
    <section class="panel controls">
        <label>LLM 공급자
            <select id="provider"><option value="openai">OpenAI</option><option value="gemini">Gemini</option></select>
        </label>
        <label>Thread ID<input id="threadId" value="business-session"></label>
    </section>
    <section class="panel">
        <label for="message">질문</label>
        <textarea id="message" rows="5" placeholder="예: 2026-05 월간 매출 보고서와 차트를 생성해 줘"></textarea>
        <button id="sendButton">통합 에이전트 실행</button>
    </section>
    <section class="panel">
        <h2>답변</h2>
        <pre id="answer">질문을 입력하세요.</pre>
    </section>
    <section class="panel grid">
        <div><h2>실행 경로</h2><pre id="route">-</pre></div>
        <div><h2>실행 추적</h2><pre id="trace">-</pre></div>
    </section>

    <hr class="divider">

    <header>
        <h1>Prompt Engineering 실습</h1>
        <p>같은 질문이라도 Prompt · System Prompt · Temperature · Top_p · Few-shot 에 따라 결과가 어떻게 달라지는지 직접 비교합니다.</p>
    </header>
    <section class="panel controls">
        <label>LLM 공급자
            <select id="labProvider"><option value="openai">OpenAI</option><option value="gemini">Gemini</option></select>
        </label>
        <label>Prompt 유형
            <select id="promptType">
                <option value="basic">기본 Prompt</option>
                <option value="expert">전문가 Prompt</option>
                <option value="friendly">친절한 설명 Prompt</option>
                <option value="step_by_step">단계별 사고 Prompt</option>
                <option value="json">JSON 출력 Prompt</option>
            </select>
        </label>
    </section>
    <section class="panel controls">
        <label>Temperature (0 ~ 2)
            <input id="temperature" type="number" min="0" max="2" step="0.1" value="0.2">
        </label>
        <label>Top_p (0 ~ 1)
            <input id="topP" type="number" min="0" max="1" step="0.05" value="1">
        </label>
        <label>Few-shot 예시 포함
            <select id="fewShot"><option value="off">사용 안 함</option><option value="on">사용</option></select>
        </label>
    </section>
    <section class="panel">
        <label for="systemPrompt">System Prompt (직접 수정 가능)</label>
        <textarea id="systemPrompt" rows="4"></textarea>
    </section>
    <section class="panel">
        <label for="customInstruction">수행 지시문 (직접 수정 가능)</label>
        <textarea id="customInstruction" rows="3"></textarea>
    </section>
    <section class="panel">
        <label for="labMessage">질문</label>
        <textarea id="labMessage" rows="4" placeholder="예: 2026-05 매출 흐름을 알려줘"></textarea>
        <button id="labSendButton">Prompt 실습 실행</button>
    </section>
    <section class="panel grid">
        <div><h2>답변</h2><pre id="labAnswer">Prompt 유형을 고르고 실행하세요.</pre></div>
        <div><h2>적용된 설정</h2><pre id="labSettings">-</pre></div>
    </section>

    <footer><a href="/docs" target="_blank">Swagger 열기</a> · <a href="/api/v1/a2a/agents" target="_blank">A2A 카드</a></footer>
</main>
<script src="/static/app.js"></script>
</body>
</html>
